name: multichamber image (v1)

on:
  push:
    branches: [v1]
  workflow_dispatch:

concurrency:
  group: multichamber-image-v1
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: multichamber/.bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: MultiChamber server tests
        working-directory: packages/web
        run: bunx vitest run server/lib/multichamber

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Anonymous Docker Hub pulls from shared runner IPs hit 429; base images
      # come through Google's Docker Hub mirror, with Docker Hub as fallback.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: multichamber/Dockerfile
          platforms: linux/amd64
          load: true
          tags: multichamber:ci
          cache-from: type=gha,scope=v1
          cache-to: type=gha,mode=max,scope=v1
      - name: Smoke test
        run: |
          docker run -d --name mc -p 3000:3000 \
            -e MULTICHAMBER_LLM_BASE_URL=http://127.0.0.1:9/v1 -e MULTICHAMBER_LLM_KEY=ci \
            -e OPENCHAMBER_ALLOW_UNAUTHENTICATED_LAN=true \
            multichamber:ci
          for _ in $(seq 1 90); do
            test "$(docker inspect -f '{{.State.Running}}' mc)" = true
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          inside=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/fs/list?path=/home/dev')
          outside=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/fs/list?path=/etc')
          echo "home=$inside etc=$outside"
          test "$inside" = 200
          test "$outside" = 403
          auth=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -d '{}' http://127.0.0.1:3000/api/auth/test)
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:3000/api/mcp)
          echo "auth=$auth mcp=$mcp"
          test "$auth" = 403
          test "$mcp" = 403
          curl -fsS http://127.0.0.1:3000/api/multichamber/policy | grep -q '"lockdown":true'
          version=$(docker exec mc opencode --version)
          echo "opencode=$version"
          test "$version" = 1.18.31
      - name: Container log
        if: always()
        run: docker logs mc 2>&1 | tail -n 100 || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "upstream=$(jq -r .version packages/web/package.json)" >>"$GITHUB_OUTPUT"
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: multichamber/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:v1
            ${{ env.IMAGE }}:v1-${{ steps.version.outputs.upstream }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=v1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
